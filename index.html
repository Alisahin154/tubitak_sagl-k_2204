<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sağlık & Barkod Analiz Asistanı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-10">

  <!-- Header -->
  <header class="bg-indigo-600 text-white py-4 px-6 shadow-md mb-6">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">Sağlık Asistanı</h1>
        <p class="text-xs text-indigo-200">Kişiselleştirilmiş Ürün Analizi</p>
      </div>
      <span class="text-xs bg-indigo-800 px-2.5 py-1 rounded-full font-medium">TÜBİTAK 2204</span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 space-y-5">

    <!-- 1. Kullanıcı Sağlık Profili -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-800 mb-3 uppercase tracking-wider border-b pb-2">1. Sağlık Profilinizi Seçin</h2>
      <div class="grid grid-cols-2 gap-2.5 text-sm">
        <label class="flex items-center space-x-2 border p-2.5 rounded-xl cursor-pointer hover:bg-slate-50 transition">
          <input type="checkbox" id="diabet" class="w-4 h-4 accent-indigo-600 rounded">
          <span class="text-slate-700 font-medium">Diyabet (Şeker)</span>
        </label>
        <label class="flex items-center space-x-2 border p-2.5 rounded-xl cursor-pointer hover:bg-slate-50 transition">
          <input type="checkbox" id="hyper" class="w-4 h-4 accent-indigo-600 rounded">
          <span class="text-slate-700 font-medium">Tansiyon (Tuz)</span>
        </label>
        <label class="flex items-center space-x-2 border p-2.5 rounded-xl cursor-pointer hover:bg-slate-50 transition">
          <input type="checkbox" id="celiac" class="w-4 h-4 accent-indigo-600 rounded">
          <span class="text-slate-700 font-medium">Çölyak (Gluten)</span>
        </label>
        <label class="flex items-center space-x-2 border p-2.5 rounded-xl cursor-pointer hover:bg-slate-50 transition">
          <input type="checkbox" id="athlete" class="w-4 h-4 accent-indigo-600 rounded">
          <span class="text-slate-700 font-medium">Sporcu (Protein)</span>
        </label>
      </div>
    </section>

    <!-- 2. Tarayıcı ve Manuel Giriş -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-800 mb-3 uppercase tracking-wider border-b pb-2">2. Barkod Okutun</h2>
      
      <!-- Kamera Alanı -->
      <div id="reader" class="rounded-xl overflow-hidden bg-black min-h-[220px] relative"></div>
      
      <!-- Manuel Barkod Arama Kutusu (Jüri/Test Kolaylığı) -->
      <div class="mt-4 pt-3 border-t">
        <label class="block text-xs font-semibold text-slate-500 mb-1">Veya Barkod Numarası Girin:</label>
        <div class="flex space-x-2">
          <input type="text" id="manual-barcode" placeholder="Örn: 8690504018002" class="flex-1 text-sm border rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button onclick="handleManualSearch()" class="bg-indigo-600 text-white text-sm font-medium px-4 py-2 rounded-xl hover:bg-indigo-700 transition">Ara</button>
        </div>
      </div>
    </section>

    <!-- Yükleniyor Göstergesi -->
    <div id="loading" class="hidden text-center py-6 bg-white rounded-2xl shadow-sm border">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
      <p class="text-sm text-slate-600 mt-2 font-medium">Ürün bilgileri getiriliyor...</p>
    </div>

    <!-- 3. Detaylı Ürün Analiz Kartı -->
    <section id="result-card" class="hidden bg-white p-5 rounded-2xl shadow-md border border-slate-200 space-y-4">
      
      <!-- Başlık, Marka, Görsel ve Nutri-Score -->
      <div class="flex items-start justify-between">
        <div class="flex items-center space-x-3">
          <img id="product-img" src="" alt="Ürün" class="w-16 h-16 object-contain rounded-lg border p-1 bg-slate-50 hidden">
          <div>
            <h3 id="product-title" class="text-base font-bold text-slate-800 leading-snug">Ürün Adı</h3>
            <p id="product-brand" class="text-xs text-slate-500 font-medium">Marka</p>
          </div>
        </div>
        <div id="nutriscore-badge" class="hidden px-3 py-1 rounded-lg text-xs font-bold text-white uppercase"></div>
      </div>

      <!-- Kişiselleştirilmiş Sağlık Değerlendirme Kutusu -->
      <div id="health-status" class="p-4 rounded-xl text-sm font-medium border-l-4"></div>

      <!-- Besin Değerleri Detay Tablosu -->
      <div>
        <h4 class="text-xs font-bold text-slate-500 uppercase mb-2">Besin Değerleri (100g / 100ml)</h4>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
            <span class="text-slate-500 block">Şeker</span>
            <span id="nutr-sugar" class="font-bold text-sm text-slate-800">-</span>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
            <span class="text-slate-500 block">Tuz</span>
            <span id="nutr-salt" class="font-bold text-sm text-slate-800">-</span>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
            <span class="text-slate-500 block">Doymuş Yağ</span>
            <span id="nutr-fat" class="font-bold text-sm text-slate-800">-</span>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200/80">
            <span class="text-slate-500 block">Protein</span>
            <span id="nutr-protein" class="font-bold text-sm text-slate-800">-</span>
          </div>
        </div>
      </div>

      <!-- İçindekiler Metni -->
      <div>
        <h4 class="text-xs font-bold text-slate-500 uppercase mb-1">İçindekiler</h4>
        <p id="ingredients-text" class="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-200/80 leading-relaxed max-h-32 overflow-y-auto">
          Bilgi bulunamadı.
        </p>
      </div>

      <button onclick="resetScanner()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-medium text-sm hover:bg-slate-900 transition">
        Yeni Ürün Tara
      </button>

    </section>

  </main>

  <script>
    let html5QrCode;

    // Sayfa Yüklendiğinde Kamerayı Varsayılan Olarak ARKA KAMERA İle Başlat
    window.addEventListener('DOMContentLoaded', () => {
      initBackCamera();
    });

    function initBackCamera() {
      html5QrCode = new Html5Qrcode("reader");
      
      const config = { 
        fps: 10, 
        qrbox: { width: 220, height: 180 }
      };

      // facingMode: "environment" -> Doğrudan ARKA KAMERAYI zorlar
      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      ).catch(err => {
        console.warn("Arka kamera zorlaması başarısız, genel kamera deneniyor:", err);
        // Arka kamera spesifik açılamazsa herhangi bir kamerayı aç
        html5QrCode.start({ facingMode: "user" }, config, onScanSuccess)
          .catch(e => console.error("Kamera açılamadı:", e));
      });
    }

    function onScanSuccess(decodedText) {
      // Tarama başarılı olunca kamerayı durdur
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          fetchProductData(decodedText);
        }).catch(err => console.error(err));
      } else {
        fetchProductData(decodedText);
      }
    }

    function handleManualSearch() {
      const barcode = document.getElementById('manual-barcode').value.trim();
      if (!barcode) {
        alert("Lütfen geçerli bir barkod numarası girin.");
        return;
      }
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => fetchProductData(barcode)).catch(() => fetchProductData(barcode));
      } else {
        fetchProductData(barcode);
      }
    }

    function fetchProductData(barcode) {
      showLoading(true);
      document.getElementById('result-card').classList.add('hidden');

      fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`)
        .then(res => res.json())
        .then(data => {
          showLoading(false);
          if (data.status === 1) {
            displayResults(data.product);
          } else {
            alert("Ürün veritabanında bulunamadı. Lütfen başka bir barkod deneyin.");
            resetScanner();
          }
        })
        .catch(err => {
          showLoading(false);
          console.error(err);
          alert("Veri çekilirken bir sorun oluştu.");
          resetScanner();
        });
    }

    function showLoading(state) {
      const loader = document.getElementById('loading');
      if (state) loader.classList.remove('hidden');
      else loader.classList.add('hidden');
    }

    function displayResults(product) {
      document.getElementById('result-card').classList.remove('hidden');

      // Başlık, marka ve görsel
      document.getElementById('product-title').innerText = product.product_name_tr || product.product_name || "İsimsiz Ürün";
      document.getElementById('product-brand').innerText = product.brands || "Marka Belirtilmemiş";
      
      const imgElem = document.getElementById('product-img');
      if (product.image_front_small_url) {
        imgElem.src = product.image_front_small_url;
        imgElem.classList.remove('hidden');
      } else {
        imgElem.classList.add('hidden');
      }

      // Nutri-Score Rozeti
      const nutriBadge = document.getElementById('nutriscore-badge');
      if (product.nutriscore_grade) {
        const grade = product.nutriscore_grade.toUpperCase();
        nutriBadge.innerText = `Nutri-Score ${grade}`;
        nutriBadge.classList.remove('hidden');
        
        // Renk sınıflandırması
        const colors = {
          'A': 'bg-emerald-600',
          'B': 'bg-green-500',
          'C': 'bg-yellow-500',
          'D': 'bg-orange-500',
          'E': 'bg-red-600'
        };
        nutriBadge.className = `px-3 py-1 rounded-lg text-xs font-bold text-white uppercase ${colors[grade] || 'bg-slate-500'}`;
      } else {
        nutriBadge.classList.add('hidden');
      }

      // Besin Değerleri (100g)
      const nutriments = product.nutriments || {};
      const sugar = nutriments.sugars_100g !== undefined ? parseFloat(nutriments.sugars_100g).toFixed(1) : 0;
      const salt = nutriments.salt_100g !== undefined ? parseFloat(nutriments.salt_100g).toFixed(1) : 0;
      const fat = nutriments['saturated-fat_100g'] !== undefined ? parseFloat(nutriments['saturated-fat_100g']).toFixed(1) : 0;
      const protein = nutriments.proteins_100g !== undefined ? parseFloat(nutriments.proteins_100g).toFixed(1) : 0;

      document.getElementById('nutr-sugar').innerText = `${sugar} g`;
      document.getElementById('nutr-salt').innerText = `${salt} g`;
      document.getElementById('nutr-fat').innerText = `${fat} g`;
      document.getElementById('nutr-protein').innerText = `${protein} g`;

      // İçindekiler Metni
      const ingredients = product.ingredients_text_tr || product.ingredients_text || "İçindekiler bilgisi bulunmuyor.";
      document.getElementById('ingredients-text').innerText = ingredients;

      // Kişiselleştirilmiş Sağlık Analizi
      evaluateHealth(sugar, salt, fat, protein, ingredients);
    }

    function evaluateHealth(sugar, salt, fat, protein, ingredients) {
      const isDiabet = document.getElementById('diabet').checked;
      const isHyper = document.getElementById('hyper').checked;
      const isCeliac = document.getElementById('celiac').checked;
      const isAthlete = document.getElementById('athlete').checked;

      let warnings = [];
      let positive = [];

      if (isDiabet && sugar > 5) {
        warnings.push(`Diyabet Riskı: Yüksek şeker oranı (${sugar}g / 100g).`);
      }
      if (isHyper && salt > 1.5) {
        warnings.push(`Tansiyon Riski: Yüksek tuz oranı (${salt}g / 100g).`);
      }
      if (isCeliac) {
        const ingLower = ingredients.toLowerCase();
        if (ingLower.includes('buğday') || ingLower.includes('gluten') || ingLower.includes('arpa') || ingLower.includes('çavdar')) {
          warnings.push(`Çölyak Riski: Ürün gluten/buğday bileşenleri içeriyor!`);
        }
      }
      if (isAthlete && protein >= 8) {
        positive.push(`Sporcu Dostu: Yüksek protein değeri (${protein}g / 100g).`);
      }

      const statusBox = document.getElementById('health-status');
      
      if (warnings.length > 0) {
        statusBox.className = "p-4 rounded-xl text-sm font-medium border-l-4 bg-red-50 text-red-700 border-red-500";
        statusBox.innerHTML = `<strong class="block mb-1 text-red-800">⚠️ Riskli / Uygun Değil:</strong>` + warnings.join('<br>');
      } else if (positive.length > 0) {
        statusBox.className = "p-4 rounded-xl text-sm font-medium border-l-4 bg-emerald-50 text-emerald-700 border-emerald-500";
        statusBox.innerHTML = `<strong class="block mb-1 text-emerald-800">✅ Önerilir:</strong>` + positive.join('<br>');
      } else {
        statusBox.className = "p-4 rounded-xl text-sm font-medium border-l-4 bg-blue-50 text-blue-700 border-blue-500";
        statusBox.innerHTML = `<strong class="block mb-1 text-blue-800">ℹ️ Uygun:</strong> Seçilen profillere göre belirgin bir kısıtlama riski tespit edilmedi.`;
      }
    }

    function resetScanner() {
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('manual-barcode').value = '';
      initBackCamera();
    }
  </script>
</body>
</html>
