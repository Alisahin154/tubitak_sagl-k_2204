<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sağlık & Barkod Analiz Asistanı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-10">

  <!-- Header -->
  <header class="bg-indigo-600 text-white py-4 px-6 shadow-md mb-6">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Sağlık Asistanı</h1>
      <span class="text-xs bg-indigo-800 px-2 py-1 rounded">TÜBİTAK 2204</span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 space-y-6">

    <!-- Kullanıcı Sağlık Profili (Seçim Alanı) -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-md font-semibold text-slate-800 mb-3 border-b pb-2">1. Sağlık Profilinizi Seçin</h2>
      <div class="grid grid-cols-2 gap-3 text-sm">
        <label class="flex items-center space-x-2 border p-2 rounded-lg cursor-pointer hover:bg-slate-50">
          <input type="checkbox" id="diabet" class="accent-indigo-600">
          <span>Diyabet (Şeker)</span>
        </label>
        <label class="flex items-center space-x-2 border p-2 rounded-lg cursor-pointer hover:bg-slate-50">
          <input type="checkbox" id="hyper" class="accent-indigo-600">
          <span>Tansiyon (Tuz)</span>
        </label>
        <label class="flex items-center space-x-2 border p-2 rounded-lg cursor-pointer hover:bg-slate-50">
          <input type="checkbox" id="celiac" class="accent-indigo-600">
          <span>Çölyak (Gluten)</span>
        </label>
        <label class="flex items-center space-x-2 border p-2 rounded-lg cursor-pointer hover:bg-slate-50">
          <input type="checkbox" id="athlete" class="accent-indigo-600">
          <span>Sporcu (Protein)</span>
        </label>
      </div>
    </section>

    <!-- Kamera Tarayıcı Alanı -->
    <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-md font-semibold text-slate-800 mb-3 border-b pb-2">2. Ürün Barkodu Okutun</h2>
      <div id="reader" class="rounded-xl overflow-hidden bg-black min-h-[220px]"></div>
    </section>

    <!-- Detaylı Ürün Analiz Kartı -->
    <section id="result-card" class="hidden bg-white p-5 rounded-2xl shadow-md border border-slate-200 space-y-4">
      
      <!-- Başlık ve Resim -->
      <div class="flex items-center space-x-4">
        <img id="product-img" src="" alt="Ürün Görseli" class="w-20 h-20 object-contain rounded-lg border p-1 bg-slate-50 hidden">
        <div>
          <h3 id="product-title" class="text-lg font-bold text-slate-800">Ürün Adı</h3>
          <p id="product-brand" class="text-sm text-slate-500">Marka</p>
        </div>
      </div>

      <!-- Kişiselleştirilmiş Sağlık Değerlendirme Kutusu -->
      <div id="health-status" class="p-4 rounded-xl text-sm font-medium border-l-4">
        <!-- JS ile doldurulacak -->
      </div>

      <!-- Besin Değerleri Detay Tablosu -->
      <div>
        <h4 class="text-sm font-bold text-slate-700 mb-2">Besin Değerleri (100g / 100ml için)</h4>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-slate-50 p-2.5 rounded-lg border">
            <span class="text-slate-500">Şeker:</span>
            <span id="nutr-sugar" class="font-bold block text-sm text-slate-800">-</span>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-lg border">
            <span class="text-slate-500">Tuz:</span>
            <span id="nutr-salt" class="font-bold block text-sm text-slate-800">-</span>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-lg border">
            <span class="text-slate-500">Doymuş Yağ:</span>
            <span id="nutr-fat" class="font-bold block text-sm text-slate-800">-</span>
          </div>
          <div class="bg-slate-50 p-2.5 rounded-lg border">
            <span class="text-slate-500">Protein:</span>
            <span id="nutr-protein" class="font-bold block text-sm text-slate-800">-</span>
          </div>
        </div>
      </div>

      <!-- İçindekiler Alanı -->
      <div>
        <h4 class="text-sm font-bold text-slate-700 mb-1">İçindekiler</h4>
        <p id="ingredients-text" class="text-xs text-slate-600 bg-slate-50 p-3 rounded-lg border leading-relaxed">
          İçindekiler bilgisi yükleniyor...
        </p>
      </div>

      <button onclick="resetScanner()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-medium text-sm hover:bg-indigo-700 transition">
        Yeni Ürün Tara
      </button>

    </section>

  </main>

  <script>
    let html5QrcodeScanner;

    function onScanSuccess(decodedText) {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear();
      }
      fetchProductData(decodedText);
    }

    function fetchProductData(barcode) {
      fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 1) {
            displayResults(data.product);
          } else {
            alert("Ürün veritabanında bulunamadı.");
            resetScanner();
          }
        })
        .catch(err => {
          console.error(err);
          alert("Veri çekilirken hata oluştu.");
          resetScanner();
        });
    }

    function displayResults(product) {
      document.getElementById('result-card').classList.remove('hidden');

      // Başlık, marka ve görsel
      document.getElementById('product-title').innerText = product.product_name_tr || product.product_name || "Bilinmeyen Ürün";
      document.getElementById('product-brand').innerText = product.brands || "Marka Belirtilmemiş";
      
      const imgElem = document.getElementById('product-img');
      if (product.image_front_small_url) {
        imgElem.src = product.image_front_small_url;
        imgElem.classList.remove('hidden');
      } else {
        imgElem.classList.add('hidden');
      }

      // Besin Değerleri
      const nutriments = product.nutriments || {};
      const sugar = nutriments.sugars_100g !== undefined ? nutriments.sugars_100g : 0;
      const salt = nutriments.salt_100g !== undefined ? nutriments.salt_100g : 0;
      const fat = nutriments['saturated-fat_100g'] !== undefined ? nutriments['saturated-fat_100g'] : 0;
      const protein = nutriments.proteins_100g !== undefined ? nutriments.proteins_100g : 0;

      document.getElementById('nutr-sugar').innerText = `${sugar} g`;
      document.getElementById('nutr-salt').innerText = `${salt} g`;
      document.getElementById('nutr-fat').innerText = `${fat} g`;
      document.getElementById('nutr-protein').innerText = `${protein} g`;

      // İçindekiler
      const ingredients = product.ingredients_text_tr || product.ingredients_text || "İçindekiler bilgisi veritabanında mevcut değil.";
      document.getElementById('ingredients-text').innerText = ingredients;

      // Kişiselleştirilmiş Sağlık Mantığı
      evaluateHealth(sugar, salt, fat, protein, ingredients);
    }

    function evaluateHealth(sugar, salt, fat, protein, ingredients) {
      const isDiabet = document.getElementById('diabet').checked;
      const isHyper = document.getElementById('hyper').checked;
      const isCeliac = document.getElementById('celiac').checked;
      const isAthlete = document.getElementById('athlete').checked;

      let warnings = [];
      let positive = [];

      // Kural Kontrolleri
      if (isDiabet && sugar > 5) {
        warnings.push(`Diyabet Uyarısı: Yüksek şeker (${sugar}g). Sınır: 5g.`);
      }
      if (isHyper && salt > 1.5) {
        warnings.push(`Tansiyon Uyarısı: Yüksek tuz (${salt}g). Sınır: 1.5g.`);
      }
      if (isCeliac) {
        const ingLower = ingredients.toLowerCase();
        if (ingLower.includes('buğday') || ingLower.includes('gluten') || ingLower.includes('arpa') || ingLower.includes('çavdar')) {
          warnings.push(`Çölyak Uyarısı: Ürün gluten/buğday türevi içeriyor!`);
        }
      }
      if (isAthlete && protein >= 8) {
        positive.push(`Sporcu Dostu: Yüksek protein içeriği (${protein}g).`);
      }

      // Ekrana Yazdırma
      const statusBox = document.getElementById('health-status');
      
      if (warnings.length > 0) {
        statusBox.className = "p-4 rounded-xl text-sm font-medium border-l-4 bg-red-50 text-red-700 border-red-500";
        statusBox.innerHTML = `<strong>⚠️ UYGUN DEĞİL:</strong><br>` + warnings.join('<br>');
      } else if (positive.length > 0) {
        statusBox.className = "p-4 rounded-xl text-sm font-medium border-l-4 bg-emerald-50 text-emerald-700 border-emerald-500";
        statusBox.innerHTML = `<strong>✅ UYGUN VE TAVSİYE EDİLİR:</strong><br>` + positive.join('<br>');
      } else {
        statusBox.className = "p-4 rounded-xl text-sm font-medium border-l-4 bg-blue-50 text-blue-700 border-blue-500";
        statusBox.innerHTML = `<strong>ℹ️ UYGUN:</strong> Seçilen profil kısıtlamalarına göre belirgin bir risk bulunmamaktadır.`;
      }
    }

    function resetScanner() {
      document.getElementById('result-card').classList.add('hidden');
      initScanner();
    }

    function initScanner() {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render(onScanSuccess);
    }

    // Uygulama Başlatma
    initScanner();
  </script>
</body>
</html>
